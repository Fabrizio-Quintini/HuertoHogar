name: Pruebas Frontend

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  pruebas-unitarias:
    name: Jasmine + Karma
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # Ejecuta las pruebas unitarias y, en el mismo paso, el analisis de
      # cobertura. Si la cobertura baja del umbral configurado en
      # karma.conf.js, Karma devuelve codigo de salida 1 y este paso falla.
      - name: Pruebas unitarias y cobertura
        run: npm test

      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/html
          if-no-files-found: ignore